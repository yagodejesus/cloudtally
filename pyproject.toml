[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cloudtally"
version = "0.1.0"
description = "FinOps in one command: cost breakdowns, tag coverage, spend anomalies, top movers, month-end forecasts and budgets from FOCUS (AWS, Azure, Google Cloud) and AWS CUR exports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yago de Jesus Martins" }]
keywords = ["finops", "cloud cost", "focus", "aws", "azure", "gcp", "cost anomaly", "billing", "cur"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/yagodejesus/cloudtally"
Issues = "https://github.com/yagodejesus/cloudtally/issues"

[project.scripts]
cloudtally = "cloudtally.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudtally"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905", "E501"]
